# CUSTOM-ONLY fine-tuning: train on just your captured images (data/custom),
# starting from models/best.pt. Fast, and makes the model excellent at YOUR
# items in YOUR room.
#
# TRADE-OFF: because the original images are NOT included here, the model will
# gradually forget classes it no longer sees (catastrophic forgetting). That's
# acceptable if your demo only shows items you captured. To keep a general
# recycler instead, add `- train/images` under train: (and restore
# val: valid/images) to mix the original set back in.
#
# val points at the custom images too (not the original valid set): with
# custom-only training the model deliberately drifts away from the original
# distribution, so validating on it would tank the score and trip early
# stopping. NOTE: train == val here means the reported mAP is optimistic
# (no held-out data) — treat it as "did it fit?", and judge real quality by
# running the live app.
#
# No `path:` key on purpose — Ultralytics resolves these relative to THIS
# file's own folder (data/), so it works from any working directory.
train: custom/images
val: custom/images
test: test/images

nc: 5

names:
  0: Glass
  1: Metal
  2: Paper
  3: Plastic
  4: Waste
